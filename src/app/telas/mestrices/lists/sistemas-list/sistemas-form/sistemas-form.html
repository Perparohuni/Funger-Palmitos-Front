<div class="wrapper">
    <p-card class="card">
        <div class="header mb-5">
            <div></div>
            <p-tag severity="secondary">
                <h2>{{ titulo }}</h2>
            </p-tag>
            <div>
                <p-button
                    icon="pi pi-arrow-left"
                    severity="info"
                    rounded="true"
                    class="ml-0"
                    [size]="'large'"
                    (click)="goList()"
                ></p-button>
            </div>
        </div>
        <div class="grid">
            <p-floatlabel class="mb-3 col-10">
                <input class="w-full" pInputText [(ngModel)]="dto.nome" type="text" name="nome" />
                <label for="nome">Nome</label>
            </p-floatlabel>
            <div class="col-2">
                <p-check-box class="mt-1" [inputId]="'ativo'" [(ngModel)]="dto.ativo" [binary]="true"></p-check-box>
                <label for="ativo" style="font-size: 1.5rem" class="ml-2">Ativo</label>
            </div>
            <div class="mt-4">
                <p-button (onClick)="id ? editar() : salvar()" [style]="{ width: '8rem' }">Salvar</p-button>
            </div>
        </div>
    </p-card>
</div>
