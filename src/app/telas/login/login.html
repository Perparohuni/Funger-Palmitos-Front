<body>
    <form (ngSubmit)="acesso()">
        <div class="login-wrapper">
            <h1>Perpas Table</h1>
            <div class="logo-wrapper"><img class="logo" src="favicon.ico" alt="" /></div>
            <p-floatlabel
                ><input pInputText id="login" [(ngModel)]="login" type="text" name="login" /><label for="login"
                    >Login</label
                ></p-floatlabel
            ><p-floatlabel
                ><input pInputText id="senha" [(ngModel)]="senha" type="password" name="senha" /><label for="senha"
                    >Senha</label
                ></p-floatlabel
            ><button pButton>Entrar</button>
        </div>
    </form>
</body>
